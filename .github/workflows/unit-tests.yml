name: Unit Tests

on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main, development]

jobs:
  policy-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/unit4-prototype
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run unit tests with coverage
        run: npm run test:coverage
      - name: Run Unit 7 system tests and verify only the documented limitation remains
        run: npm run test:system
